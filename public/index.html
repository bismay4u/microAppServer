<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartinfoLogiks - Apphub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style.css">
    <script src="/assets/script.js"></script>
    <style>
        header {
            position: sticky;
        }
        main {
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 20px !important;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .modal-box input:focus {
            border-color: #7c3aed;
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 9999px;
            background: rgba(255,255,255,0.25);
            color: white;
            margin-right: 3px;
            margin-top: 2px;
        }
        .addon-link-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="glass">
            <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center space-x-3 animate-fadeInUp">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-lg">
                        <span class="text-2xl">🚀</span>
                    </div>
                    <span class="text-white text-2xl font-bold">Apphub</span>
                </div>
                <div class="flex items-center space-x-4 animate-fadeInUp" style="animation-delay: 0.2s;">
                    <a href="https://www.smartinfologiks.com/" class="text-white hover:text-gray-200 transition px-4 py-2">Home</a>

                    <!-- Logged-out state -->
                    <div id="nav-loggedout">
                        <button onclick="openLoginModal()" class="bg-white text-purple-600 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition shadow-lg">
                            Sign In
                        </button>
                    </div>

                    <!-- Logged-in state -->
                    <div id="nav-loggedin" class="hidden flex items-center space-x-3">
                        <a id="nav-setup-link" href="#" title="Setup"
                            class="hidden bg-white/20 border border-white/40 text-white w-9 h-9 rounded-lg hover:bg-white/30 transition items-center justify-center">
                            <span class="text-lg">⚙️</span>
                        </a>
                        <span id="nav-username" class="text-white font-semibold"></span>
                        <button onclick="logout()" class="bg-white/20 border border-white/40 text-white px-4 py-2 rounded-lg hover:bg-white/30 transition text-sm">
                            Sign Out
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Hero Section -->
        <main class="flex-1 flex items-center justify-center px-6 py-12">
            <div class="max-w-7xl w-full">
                <div class="text-center mb-16 animate-fadeInUp">
                    <p class="text-2xl text-white/90 max-w-2xl mx-auto">
                        Access all SmartinfoLogiks Apps from one beautiful central panel. Fast, secure, and designed for productivity.
                    </p>
                    <p id="error-banner" class="hidden mt-4 text-red-200 text-sm bg-red-500/30 rounded-lg px-4 py-2 max-w-sm mx-auto"></p>
                </div>

                <!-- Grouped Apps + Addon Links -->
                <div id="grid-container" class="animate-fadeInUp" style="animation-delay: 0.3s;"></div>

                <!-- Floating Elements -->
                <div class="absolute top-20 right-20 w-32 h-32 bg-white/10 rounded-full blur-3xl animate-float"></div>
                <div class="absolute bottom-20 left-20 w-40 h-40 bg-white/10 rounded-full blur-3xl animate-float" style="animation-delay: 3s;"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="glass py-6">
            <div class="max-w-7xl mx-auto px-6 text-center">
                <p class="text-white/80 text-sm">© 2026 SmartinfoLogiks. Designed for productivity and elegance.</p>
            </div>
        </footer>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay" onclick="closeLoginModalOutside(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 class="text-2xl font-bold text-gray-800 mb-1">Sign in</h2>
            <p class="text-gray-500 text-sm mb-6">Access your SmartinfoLogiks apps</p>

            <div id="login-error" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-2 text-sm"></div>

            <form onsubmit="doLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="login-username" autocomplete="username" required placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" autocomplete="current-password" required placeholder="Enter password">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Sign In
                </button>
            </form>

            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold" style="position:absolute">✕</button>
        </div>
    </div>

    <script>
        // ── Auth helpers ──────────────────────────────────────────────────────
        function getToken() { return localStorage.getItem('auth_token'); }
        function getUser()  { return JSON.parse(localStorage.getItem('auth_user') || 'null'); }

        function setSession(token, user) {
            localStorage.setItem('auth_token', token);
            localStorage.setItem('auth_user', JSON.stringify(user));
        }

        function clearSession() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
        }

        function updateNavState() {
            const user = getUser();
            const setupLink = document.getElementById('nav-setup-link');
            if (user) {
                document.getElementById('nav-loggedout').classList.add('hidden');
                document.getElementById('nav-loggedin').classList.remove('hidden');
                document.getElementById('nav-username').textContent = user.username;

                if (user.roles && user.roles.includes('admin')) {
                    setupLink.href = `/setup/?token=${encodeURIComponent(getToken())}`;
                    setupLink.classList.remove('hidden');
                    setupLink.classList.add('inline-flex');
                } else {
                    setupLink.classList.add('hidden');
                    setupLink.classList.remove('inline-flex');
                }
            } else {
                document.getElementById('nav-loggedout').classList.remove('hidden');
                document.getElementById('nav-loggedin').classList.add('hidden');
                setupLink.classList.add('hidden');
                setupLink.classList.remove('inline-flex');
            }
        }

        // ── Login modal ───────────────────────────────────────────────────────
        function openLoginModal() {
            document.getElementById('login-modal').classList.add('active');
            document.getElementById('login-username').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('active');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function closeLoginModalOutside(e) {
            if (e.target === document.getElementById('login-modal')) closeLoginModal();
        }

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value.trim(),
                        password: document.getElementById('login-password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');

                setSession(data.token, data.user);
                closeLoginModal();
                updateNavState();
                loadGrid();
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function logout() {
            clearSession();
            updateNavState();
            loadGrid();
        }

        // ── Grouped apps + addon links grid ──────────────────────────────────────
        async function loadGrid() {
            try {
                const token = getToken();
                const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
                const [appsRes, addonsRes] = await Promise.all([
                    fetch('/getapps', { headers }),
                    fetch('/addons', { headers })
                ]);
                if (!appsRes.ok || !addonsRes.ok) throw new Error('Failed to load apps');

                const apps = (await appsRes.json()).map(a => ({ ...a, _type: 'app' })).filter(a => !a.hidden);
                const addons = (await addonsRes.json()).map(a => ({ ...a, _type: 'addon' }));
                const items = [...apps, ...addons];

                const container = document.getElementById('grid-container');
                container.innerHTML = '';

                if (items.length === 0) {
                    container.innerHTML = '<p class="text-white/60 text-center py-8">No apps available. Sign in to see more.</p>';
                    return;
                }

                let sectionCount = 0;

                const recentItems = getRecentItems(items);
                if (recentItems.length) {
                    container.appendChild(buildSection('⏱ Recently Used', recentItems, sectionCount++ > 0));
                }

                const groups = {};
                items.forEach(item => {
                    const groupName = (item.group && item.group.trim()) || 'General';
                    (groups[groupName] = groups[groupName] || []).push(item);
                });

                const groupNames = Object.keys(groups).sort((a, b) => {
                    if (a === 'General') return 1;
                    if (b === 'General') return -1;
                    return a.localeCompare(b);
                });

                groupNames.forEach(groupName => {
                    container.appendChild(buildSection(groupName, groups[groupName], sectionCount++ > 0));
                });
            } catch (error) {
                console.error('Error loading apps:', error);
            }
        }

        function buildSection(title, items, spaced) {
            const section = document.createElement('div');
            section.className = spaced ? 'mt-12' : '';

            const heading = document.createElement('h2');
            heading.className = 'text-white text-xl font-bold mb-4 opacity-90';
            heading.textContent = title;
            section.appendChild(heading);

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4';
            items.forEach((item, index) => grid.appendChild(buildCard(item, index)));
            section.appendChild(grid);

            return section;
        }

        // ── Recently used shortcuts ──────────────────────────────────────────────
        const RECENT_KEY = 'apphub_recent_items';
        const RECENT_MAX = 6;

        function itemKey(item) {
            return item._type + ':' + (item._type === 'addon' ? item.id : item.url);
        }

        function recordRecentUse(item) {
            let recent;
            try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { recent = []; }
            const key = itemKey(item);
            recent = recent.filter(k => k !== key);
            recent.unshift(key);
            localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, RECENT_MAX)));
        }

        function getRecentItems(items) {
            let recent;
            try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { recent = []; }
            const byKey = {};
            items.forEach(item => { byKey[itemKey(item)] = item; });
            return recent.map(key => byKey[key]).filter(Boolean);
        }

        function buildCard(item, index) {
            const card = document.createElement('div');
            card.className = 'app-card glass rounded-xl p-4 cursor-pointer group animate-fadeInUp relative';
            card.style.animationDelay = `${0.1 + (index * 0.05)}s`;

            const roleBadges = (item.roles || []).map(r =>
                `<span class="badge">${r}</span>`
            ).join('');
            const linkIcon = item._type === 'addon' ? '<span class="addon-link-icon">↗</span>' : '';

            card.innerHTML = `
                ${linkIcon}
                <div class="bg-gradient-to-br from-${item.color}-400 to-${item.color}-600 w-12 h-12 rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition">
                    <span class="text-2xl">${item.icon}</span>
                </div>
                <h3 class="text-white text-base font-bold mb-1">${item.name}</h3>
                <p class="text-white/70 text-xs mb-1">${item.description || ''}</p>
                ${roleBadges ? `<div class="mt-1">${roleBadges}</div>` : ''}
            `;

            card.addEventListener('click', function() {
                recordRecentUse(item);
                if (item._type === 'addon') {
                    window.open(item.url, '_blank', 'noopener,noreferrer');
                } else {
                    const t = getToken();
                    window.location.href = t ? `${item.url}?token=${encodeURIComponent(t)}` : item.url;
                }
            });

            return card;
        }

        // ── Error banner from redirect ─────────────────────────────────────────
        function checkErrorParam() {
            const params = new URLSearchParams(window.location.search);
            const err = params.get('error');
            if (err === 'unauthorized') {
                showErrorBanner('Please sign in to access that page.');
                openLoginModal();
            } else if (err === 'forbidden') {
                showErrorBanner('You do not have permission to access that page.');
            }
            if (err) {
                // Clean up URL
                history.replaceState({}, '', window.location.pathname);
            }
        }

        function showErrorBanner(msg) {
            const el = document.getElementById('error-banner');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 6000);
        }

        // ── Init ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            updateNavState();
            checkErrorParam();
            loadGrid();
        });
    </script>
</body>
</html>
