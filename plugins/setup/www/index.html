<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
            overflow: hidden;
        }
        .shell {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 20px 20px 16px;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .sidebar-user {
            padding: 12px 20px;
            font-size: .8rem;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .sidebar-user .name { color: #e2e8f0; font-weight: 600; }
        .nav-group-label {
            padding: 16px 20px 6px;
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #64748b;
            font-weight: 700;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: .9rem;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all .15s;
        }
        .nav-item:hover { background: rgba(255,255,255,.06); color: white; }
        .nav-item.active {
            background: rgba(255,255,255,.1);
            border-left-color: #38bdf8;
            color: white;
            font-weight: 600;
        }
        .nav-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,.08);
        }
        .sidebar-footer a {
            color: #94a3b8;
            text-decoration: none;
            font-size: .85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-footer a:hover { color: white; }
        .content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .content-topbar {
            padding: 14px 24px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }
        .content-body {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
        }
        .content-body iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
        }
        .content-body iframe.active { display: block; }
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; }
        .auth-error {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div id="shell" class="shell" style="display:none;">
    <aside class="sidebar">
        <div class="sidebar-brand"><span>⚙️</span> Setup</div>
        <div class="sidebar-user">Signed in as<br><span class="name" id="current-user-name"></span></div>
        <div id="sidebar-nav"></div>
        <div class="sidebar-footer">
            <a href="/"><i class="bi bi-arrow-left"></i> Back to Apphub</a>
        </div>
    </aside>
    <div class="content">
        <div class="content-topbar" id="content-title">Select a section</div>
        <div class="content-body" id="content-body">
            <div class="empty-state" id="empty-state">
                <i class="bi bi-gear-wide-connected"></i>
                <div>Pick a section from the sidebar to get started.</div>
            </div>
        </div>
    </div>
</div>

<div id="auth-error" class="auth-error" style="display:none;">
    <i class="bi bi-shield-exclamation" style="font-size:2.5rem"></i>
    <div id="auth-error-msg"></div>
    <a href="/" style="color:#7c3aed;">← Back to Apphub</a>
</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token')
           || localStorage.getItem('auth_token');

function authHeaders() {
    return { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
}

async function apiFetch(method, path) {
    const res = await fetch(path, { method, headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const frames = {};
let activeFolder = null;

function selectSection(item) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + item.folder)?.classList.add('active');

    document.getElementById('content-title').textContent = item.name;
    document.getElementById('empty-state').style.display = 'none';

    Object.values(frames).forEach(f => f.classList.remove('active'));

    if (!frames[item.folder]) {
        const iframe = document.createElement('iframe');
        iframe.src = `${item.url}/?token=${encodeURIComponent(TOKEN)}`;
        document.getElementById('content-body').appendChild(iframe);
        frames[item.folder] = iframe;
    }
    frames[item.folder].classList.add('active');
    activeFolder = item.folder;
}

function renderNav(items) {
    const groups = {};
    items.forEach(item => {
        const g = item.group || 'General';
        (groups[g] = groups[g] || []).push(item);
    });

    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';
    Object.keys(groups).sort().forEach(groupName => {
        const label = document.createElement('div');
        label.className = 'nav-group-label';
        label.textContent = groupName;
        nav.appendChild(label);

        groups[groupName].forEach(item => {
            const el = document.createElement('div');
            el.className = 'nav-item';
            el.id = 'nav-' + item.folder;
            el.innerHTML = `<span class="icon">${item.icon || '📦'}</span><span>${escHtml(item.name)}</span>`;
            el.addEventListener('click', () => selectSection(item));
            nav.appendChild(el);
        });
    });

    if (items.length) selectSection(items[0]);
}

(async function init() {
    if (!TOKEN) {
        window.location.href = '/?error=unauthorized';
        return;
    }
    try {
        const me = await apiFetch('GET', '/auth/me');
        if (!me.roles.includes('admin')) throw new Error('Admin access required');

        document.getElementById('current-user-name').textContent = me.username;
        document.getElementById('shell').style.display = 'flex';

        const apps = await apiFetch('GET', '/getapps');
        const hiddenApps = apps.filter(a => a.hidden && a.folder !== 'setup');
        renderNav(hiddenApps);
    } catch(e) {
        document.getElementById('auth-error-msg').textContent = e.message;
        document.getElementById('auth-error').style.display = 'flex';
    }
})();
</script>
</body>
</html>
