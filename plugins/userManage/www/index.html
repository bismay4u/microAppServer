<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; }
        .topbar {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(79,70,229,.3);
        }
        .topbar .brand { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .topbar .user-pill {
            background: rgba(255,255,255,.2);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: .85rem;
        }
        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,.06);
            overflow: hidden;
        }
        .table thead th {
            background: #f8f9ff;
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #6b7280;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
        }
        .table tbody tr { vertical-align: middle; }
        .table tbody tr:hover { background: #fafbff; }
        .role-badge {
            display: inline-block;
            font-size: .7rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 600;
            margin: 2px 2px 2px 0;
        }
        .role-badge.admin { background: #fee2e2; color: #991b1b; }
        .tag-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border: 1.5px solid #dee2e6;
            border-radius: 8px;
            padding: 6px 10px;
            min-height: 42px;
            align-items: center;
            cursor: text;
        }
        .tag-input-area:focus-within { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
        .tag-chip {
            background: #ede9fe;
            color: #5b21b6;
            border-radius: 999px;
            padding: 2px 8px 2px 10px;
            font-size: .8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tag-chip button {
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
            color: #7c3aed;
            cursor: pointer;
            font-size: .9rem;
        }
        .tag-input-area input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 80px;
            font-size: .9rem;
        }
        .suggested-roles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .suggested-roles button {
            font-size: .75rem;
            padding: 2px 10px;
            border-radius: 999px;
            border: 1.5px solid #c4b5fd;
            background: white;
            color: #5b21b6;
            cursor: pointer;
            transition: all .15s;
        }
        .suggested-roles button:hover { background: #ede9fe; }
        .empty-state { padding: 60px 20px; text-align: center; color: #9ca3af; }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }
        .btn-action { padding: 4px 10px; font-size: .8rem; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: .9rem;
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <div class="brand">
        <span>👥</span> User Management
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="user-pill" id="current-user-pill"></span>
        <a href="/" id="home-link" class="btn btn-sm btn-light">← Home</a>
    </div>
</div>

<!-- Main Content -->
<div class="container-fluid py-4 px-4">

    <div id="auth-error" class="alert alert-danger d-none">
        <i class="bi bi-shield-exclamation me-2"></i>
        <span id="auth-error-msg"></span>
    </div>

    <div id="app-content" class="d-none">
        <!-- Header row -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h5 class="mb-0 fw-bold">Users</h5>
                <small class="text-muted" id="user-count"></small>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
                <i class="bi bi-person-plus me-1"></i> Add User
            </button>
        </div>

        <!-- Users table -->
        <div class="main-card">
            <div id="table-loading" class="text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div> Loading users…
            </div>
            <div id="table-wrap" class="d-none">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th style="width:44px"></th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Created</th>
                            <th style="width:110px"></th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
                <div id="empty-state" class="empty-state d-none">
                    <i class="bi bi-people"></i>
                    No users found.
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="modal-title">Add User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="modal-error" class="alert alert-danger d-none py-2 small"></div>
                <form id="user-form" onsubmit="submitUserForm(event)" novalidate>
                    <input type="hidden" id="form-user-id">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control" id="form-username" required placeholder="e.g. johndoe">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="form-email" placeholder="optional">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password
                            <span id="pw-hint" class="text-muted fw-normal small ms-1">(leave blank to keep existing)</span>
                        </label>
                        <input type="password" class="form-control" id="form-password" autocomplete="new-password" placeholder="Enter password">
                    </div>

                    <div class="mb-1">
                        <label class="form-label fw-semibold">Roles</label>
                        <div class="tag-input-area" id="tag-input-area" onclick="document.getElementById('role-text-input').focus()">
                            <input type="text" id="role-text-input" placeholder="Type role and press Enter"
                                onkeydown="handleRoleInput(event)">
                        </div>
                        <div class="suggested-roles mt-2" id="suggested-roles"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitUserForm(event)" id="save-btn">
                    <span id="save-label">Save</span>
                    <span id="save-spinner" class="spinner-border spinner-border-sm ms-1 d-none"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-body text-center py-4">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2.5rem"></i>
                <h5 class="mt-3 mb-1 fw-bold">Delete user?</h5>
                <p class="text-muted small mb-3">This cannot be undone.</p>
                <p class="fw-semibold" id="delete-username-label"></p>
            </div>
            <div class="modal-footer border-0 pt-0 justify-content-center">
                <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Auth ─────────────────────────────────────────────────────────────────────
const TOKEN = new URLSearchParams(window.location.search).get('token')
           || localStorage.getItem('auth_token');

function authHeaders() {
    return { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
}

async function apiFetch(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
}

// ── Roles tag input ───────────────────────────────────────────────────────────
let currentRoles = [];
const KNOWN_ROLES = ['admin', 'admin_products'];

function renderRoleTags() {
    const area = document.getElementById('tag-input-area');
    const input = document.getElementById('role-text-input');
    area.querySelectorAll('.tag-chip').forEach(el => el.remove());
    currentRoles.forEach(role => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `${role}<button type="button" onclick="removeRole('${role}')">&times;</button>`;
        area.insertBefore(chip, input);
    });
    renderSuggestedRoles();
}

function addRole(role) {
    role = role.trim().toLowerCase().replace(/\s+/g, '_');
    if (!role || currentRoles.includes(role)) return;
    currentRoles.push(role);
    renderRoleTags();
}

function removeRole(role) {
    currentRoles = currentRoles.filter(r => r !== role);
    renderRoleTags();
}

function handleRoleInput(e) {
    if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addRole(e.target.value);
        e.target.value = '';
    } else if (e.key === 'Backspace' && e.target.value === '' && currentRoles.length) {
        removeRole(currentRoles[currentRoles.length - 1]);
    }
}

function renderSuggestedRoles() {
    const container = document.getElementById('suggested-roles');
    const remaining = KNOWN_ROLES.filter(r => !currentRoles.includes(r));
    container.innerHTML = remaining.map(r =>
        `<button type="button" onclick="addRole('${r}')">${r}</button>`
    ).join('');
}

// ── User table ────────────────────────────────────────────────────────────────
let allUsers = [];

async function loadUsers() {
    document.getElementById('table-loading').classList.remove('d-none');
    document.getElementById('table-wrap').classList.add('d-none');
    try {
        allUsers = await apiFetch('GET', '/users');
        renderTable();
    } catch(e) {
        showAuthError(e.message);
    } finally {
        document.getElementById('table-loading').classList.add('d-none');
        document.getElementById('table-wrap').classList.remove('d-none');
    }
}

function renderTable() {
    const tbody = document.getElementById('users-tbody');
    const empty = document.getElementById('empty-state');
    document.getElementById('user-count').textContent = `${allUsers.length} user${allUsers.length !== 1 ? 's' : ''}`;

    if (!allUsers.length) {
        tbody.innerHTML = '';
        empty.classList.remove('d-none');
        return;
    }
    empty.classList.add('d-none');

    tbody.innerHTML = allUsers.map(u => `
        <tr>
            <td>
                <div class="avatar">${u.username.charAt(0).toUpperCase()}</div>
            </td>
            <td class="fw-semibold">${escHtml(u.username)}</td>
            <td class="text-muted small">${escHtml(u.email || '—')}</td>
            <td>${roleBadges(u.roles)}</td>
            <td class="text-muted small">${formatDate(u.createdAt)}</td>
            <td class="text-end">
                <button class="btn btn-outline-primary btn-action me-1" onclick="openEditModal('${u.id}')">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-outline-danger btn-action" onclick="openDeleteModal('${u.id}')"
                    ${u.username === 'admin' ? 'disabled title="Cannot delete the default admin"' : ''}>
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

function roleBadges(roles) {
    if (!roles || !roles.length) return '<span class="text-muted small">none</span>';
    return roles.map(r =>
        `<span class="role-badge ${r === 'admin' ? 'admin' : ''}">${escHtml(r)}</span>`
    ).join('');
}

// ── Create modal ──────────────────────────────────────────────────────────────
function openCreateModal() {
    document.getElementById('modal-title').textContent = 'Add User';
    document.getElementById('form-user-id').value = '';
    document.getElementById('form-username').value = '';
    document.getElementById('form-username').disabled = false;
    document.getElementById('form-email').value = '';
    document.getElementById('form-password').value = '';
    document.getElementById('form-password').required = true;
    document.getElementById('pw-hint').classList.add('d-none');
    document.getElementById('modal-error').classList.add('d-none');
    currentRoles = [];
    renderRoleTags();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('userModal')).show();
}

function openEditModal(id) {
    const user = allUsers.find(u => u.id === id);
    if (!user) return;
    document.getElementById('modal-title').textContent = 'Edit User';
    document.getElementById('form-user-id').value = user.id;
    document.getElementById('form-username').value = user.username;
    document.getElementById('form-username').disabled = true;
    document.getElementById('form-email').value = user.email || '';
    document.getElementById('form-password').value = '';
    document.getElementById('form-password').required = false;
    document.getElementById('pw-hint').classList.remove('d-none');
    document.getElementById('modal-error').classList.add('d-none');
    currentRoles = [...(user.roles || [])];
    renderRoleTags();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('userModal')).show();
}

async function submitUserForm(e) {
    e.preventDefault();
    const errEl = document.getElementById('modal-error');
    const saveBtn = document.getElementById('save-btn');
    const spinner = document.getElementById('save-spinner');
    errEl.classList.add('d-none');
    saveBtn.disabled = true;
    spinner.classList.remove('d-none');

    const id = document.getElementById('form-user-id').value;
    const username = document.getElementById('form-username').value.trim();
    const email = document.getElementById('form-email').value.trim();
    const password = document.getElementById('form-password').value;
    const roles = [...currentRoles];

    try {
        if (id) {
            const body = { email, roles };
            if (password) body.password = password;
            await apiFetch('PUT', `/users/${id}`, body);
        } else {
            if (!username) throw new Error('Username is required');
            if (!password) throw new Error('Password is required');
            await apiFetch('POST', '/users', { username, email, password, roles });
        }
        bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
        await loadUsers();
    } catch(err) {
        errEl.textContent = err.message;
        errEl.classList.remove('d-none');
    } finally {
        saveBtn.disabled = false;
        spinner.classList.add('d-none');
    }
}

// ── Delete modal ──────────────────────────────────────────────────────────────
let pendingDeleteId = null;

function openDeleteModal(id) {
    const user = allUsers.find(u => u.id === id);
    if (!user) return;
    pendingDeleteId = id;
    document.getElementById('delete-username-label').textContent = user.username;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
}

document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const btn = document.getElementById('confirm-delete-btn');
    btn.disabled = true;
    try {
        await apiFetch('DELETE', `/users/${pendingDeleteId}`);
        bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
        pendingDeleteId = null;
        await loadUsers();
    } catch(e) {
        alert(e.message);
    } finally {
        btn.disabled = false;
    }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function showAuthError(msg) {
    document.getElementById('auth-error-msg').textContent = msg;
    document.getElementById('auth-error').classList.remove('d-none');
    document.getElementById('app-content').classList.add('d-none');
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (window.self !== window.top) document.getElementById('home-link')?.remove();

(async function init() {
    if (!TOKEN) {
        window.location.href = '/?error=unauthorized';
        return;
    }
    try {
        const me = await apiFetch('GET', '/auth/me');
        if (!me.roles.includes('admin')) throw new Error('Admin access required');
        document.getElementById('current-user-pill').textContent = me.username;
        document.getElementById('app-content').classList.remove('d-none');

        // Gather known roles from all users for suggestions
        const users = await apiFetch('GET', '/users');
        users.forEach(u => (u.roles || []).forEach(r => { if (!KNOWN_ROLES.includes(r)) KNOWN_ROLES.push(r); }));

        await loadUsers();
    } catch(e) {
        showAuthError(e.message);
    }
})();
</script>
</body>
</html>
